# Retro76 web — reverse proxy to python web/server.py (:8080)
# Certbot adds the SSL server block and redirects HTTP → HTTPS.

upstream yurots_web {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;
    server_tokens off;
    client_max_body_size 6m;          # comprobantes premium de hasta 5 MB
    client_body_timeout 20s;
    add_header Strict-Transport-Security "max-age=31536000" always;   # activo cuando Certbot ponga HTTPS

    location / {
        proxy_pass http://yurots_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # el server.py solo cree estos headers si vienen de 127.0.0.1
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
