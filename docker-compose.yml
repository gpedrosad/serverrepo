services:
  yurots:
    build: .
    container_name: yurots
    platform: linux/386
    working_dir: /app/YurOTS/ots
    volumes:
      - ./server/YurOTS:/app/YurOTS
      - ./scripts/docker-start-yurots.sh:/docker-start-yurots.sh:ro
    ports:
      - "7171:7171"
      - "7172:7172"
    environment:
      - YUROTS_ITEMS_OTB
      - YUROTS_ITEMS_XML
      - YUROTS_SOCKET_DEBUG=1
    healthcheck:
      test:
        - CMD-SHELL
        - |
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/7171 \
            && printf "\x06\x00\xff\xffinfo" >&3 \
            && head -c 2048 <&3 | grep -q serverinfo' || exit 1
      interval: 30s
      timeout: 8s
      retries: 2
      start_period: 60s
    command: bash /docker-start-yurots.sh
