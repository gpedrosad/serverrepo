<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <title>Items custom — Retro76</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; }
    .chip.active {
      color: #fafafa;
      border-color: rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
    }
    .pixel-img {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .items-table th,
    .items-table td {
      border-bottom: 1px solid rgba(255,255,255,.06);
      padding: 0.55rem 0.65rem;
      vertical-align: middle;
    }
    .items-table tbody tr:hover {
      background: rgba(255,255,255,.03);
    }
    .items-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #0f0f0f;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #71717a;
      white-space: nowrap;
    }
    .items-table td.num {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
      white-space: nowrap;
    }
  </style>
</head>
<body class="h-full text-zinc-100 antialiased">
  <div id="gate" class="min-h-full flex items-center justify-center px-4">
    <div class="w-full max-w-md rounded-xl border border-white/10 bg-white/[0.03] p-6">
      <p class="text-xs uppercase tracking-[0.2em] text-zinc-500 mb-2">Acceso privado</p>
      <h1 class="text-2xl font-semibold mb-2">Catálogo items custom</h1>
      <p class="text-sm text-zinc-400 mb-6">Pack Zagan (20100+). Solo staff.</p>
      <label class="block text-sm text-zinc-400 mb-2" for="token-input">Clave</label>
      <input id="token-input" type="password" autocomplete="off"
        class="w-full rounded-lg border border-white/10 bg-black/40 px-3 py-2 text-sm outline-none focus:border-white/25"
        placeholder="clave">
      <button id="token-submit"
        class="mt-4 w-full rounded-lg bg-white text-black py-2 text-sm font-medium hover:bg-zinc-200">
        Entrar
      </button>
      <p id="gate-error" class="mt-3 text-sm text-red-400 hidden"></p>
    </div>
  </div>

  <div id="app" class="hidden min-h-full flex flex-col">
    <header class="border-b border-white/10 bg-[#0a0a0a] px-4 py-4">
      <div class="mx-auto max-w-[1600px] flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
        <div>
          <p class="text-xs uppercase tracking-[0.2em] text-zinc-500">Retro76 · privado</p>
          <h1 class="text-2xl font-semibold">Items agregados</h1>
          <p id="summary" class="text-sm text-zinc-400 mt-1"></p>
        </div>
        <div class="flex flex-col sm:flex-row gap-2 sm:items-center">
          <input id="search" type="search" placeholder="Buscar nombre, id, categoría…"
            class="rounded-lg border border-white/10 bg-black/40 px-3 py-2 text-sm outline-none focus:border-white/25 w-full sm:w-72">
          <button id="logout"
            class="rounded-lg border border-white/10 px-3 py-2 text-sm text-zinc-300 hover:border-white/20">
            Salir
          </button>
        </div>
      </div>
      <div id="filters" class="mx-auto max-w-[1600px] mt-4 flex flex-wrap gap-2"></div>
    </header>

    <main class="flex-1 overflow-auto px-4 py-4">
      <div class="mx-auto max-w-[1600px]">
        <table class="items-table w-full text-sm">
          <thead>
            <tr>
              <th class="text-left w-12">Img</th>
              <th class="text-left">Nombre</th>
              <th class="text-left">Descripción</th>
              <th class="text-left">Categoría</th>
              <th class="text-left">Grupo</th>
              <th class="text-right">Atk</th>
              <th class="text-right">Def</th>
              <th class="text-right">Arm</th>
              <th class="text-right">Peso</th>
              <th class="text-left">Tipo</th>
              <th class="text-left">Slot</th>
              <th class="text-right">Mag</th>
              <th class="text-right">Server</th>
              <th class="text-right">Client</th>
              <th class="text-right">Sprite</th>
              <th class="text-left">Prototipo</th>
              <th class="text-left">Spawn</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <p id="empty" class="hidden text-center text-zinc-500 py-16">No hay items con ese filtro.</p>
      </div>
    </main>
  </div>

  <script>
    const TOKEN_KEY = 'retro76_items_admin_token';
    const gate = document.getElementById('gate');
    const app = document.getElementById('app');
    const gateError = document.getElementById('gate-error');
    const tokenInput = document.getElementById('token-input');
    const tbody = document.getElementById('tbody');
    const empty = document.getElementById('empty');
    const filtersEl = document.getElementById('filters');
    const searchEl = document.getElementById('search');
    const summaryEl = document.getElementById('summary');

    let token = sessionStorage.getItem(TOKEN_KEY) || '';
    let items = [];
    let activeCategory = 'Todos';

    function authHeaders() {
      return { 'X-Items-Token': token };
    }

    function imageUrl(name) {
      return `/api/zagan-items/img/${encodeURIComponent(name)}?token=${encodeURIComponent(token)}`;
    }

    function stat(value) {
      return value === null || value === undefined || value === '' ? '—' : value;
    }

    async function loadCatalog() {
      const res = await fetch('/api/zagan-items', { headers: authHeaders() });
      if (!res.ok) throw new Error('Clave inválida o catálogo no disponible.');
      const data = await res.json();
      items = data.items || [];
      summaryEl.textContent = `${items.length} items · premium, runas y Crisol`;
      buildFilters();
      render();
    }

    function buildFilters() {
      const categories = ['Todos', ...new Set(items.map((item) => item.category))];
      filtersEl.innerHTML = '';
      for (const category of categories) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = category;
        btn.className = 'chip rounded-full border border-white/10 px-3 py-1 text-xs text-zinc-400' + (category === activeCategory ? ' active' : '');
        btn.addEventListener('click', () => {
          activeCategory = category;
          buildFilters();
          render();
        });
        filtersEl.appendChild(btn);
      }
    }

    function filteredItems() {
      const q = searchEl.value.trim().toLowerCase();
      return items.filter((item) => {
        if (activeCategory !== 'Todos' && item.category !== activeCategory) return false;
        if (!q) return true;
        const proto = item.prototypeName ? `${item.prototypeServerId} ${item.prototypeName}` : String(item.prototypeServerId);
        return (
          item.name.toLowerCase().includes(q) ||
          (item.description || '').toLowerCase().includes(q) ||
          item.category.toLowerCase().includes(q) ||
          String(item.serverId).includes(q) ||
          String(item.clientId).includes(q) ||
          String(item.spriteId).includes(q) ||
          proto.toLowerCase().includes(q) ||
          (item.group || '').toLowerCase().includes(q)
        );
      });
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).catch(() => {});
    }

    function render() {
      const rows = filteredItems();
      tbody.innerHTML = '';
      empty.classList.toggle('hidden', rows.length > 0);
      for (const item of rows) {
        const tr = document.createElement('tr');
        const protoLabel = item.prototypeName
          ? `${item.prototypeServerId} · ${item.prototypeName}`
          : String(item.prototypeServerId);
        tr.innerHTML = `
          <td>
            <img src="${imageUrl(item.image)}" alt="" width="32" height="32" class="pixel-img rounded bg-black/30" loading="lazy">
          </td>
          <td class="capitalize font-medium">${item.name}</td>
          <td class="text-zinc-400 text-xs max-w-xs">${stat(item.description)}</td>
          <td class="text-zinc-400">${item.category}</td>
          <td class="text-zinc-400">${stat(item.group)}</td>
          <td class="num text-right">${stat(item.attack)}</td>
          <td class="num text-right">${stat(item.defence)}</td>
          <td class="num text-right">${stat(item.armor)}</td>
          <td class="num text-right">${stat(item.weight)}</td>
          <td class="text-zinc-400">${stat(item.weaponType)}</td>
          <td class="text-zinc-400">${stat(item.slot)}</td>
          <td class="num text-right">${stat(item.magLevel)}</td>
          <td class="num text-right text-zinc-300">${item.serverId}</td>
          <td class="num text-right text-zinc-400">${item.clientId}</td>
          <td class="num text-right text-zinc-500">${item.spriteId}</td>
          <td class="text-zinc-500 text-xs">${protoLabel}</td>
          <td>
            <button type="button" data-spawn="${item.spawn}"
              class="copy-spawn rounded border border-white/10 px-2 py-1 text-xs font-mono text-zinc-200 hover:border-white/20">
              ${item.spawn}
            </button>
          </td>
        `;
        tr.querySelector('.copy-spawn').addEventListener('click', (ev) => {
          copyText(ev.currentTarget.dataset.spawn);
          const old = ev.currentTarget.textContent;
          ev.currentTarget.textContent = 'copiado';
          setTimeout(() => { ev.currentTarget.textContent = old; }, 900);
        });
        tbody.appendChild(tr);
      }
    }

    async function enter(withToken) {
      token = withToken.trim();
      if (!token) return;
      try {
        await loadCatalog();
        sessionStorage.setItem(TOKEN_KEY, token);
        gate.classList.add('hidden');
        app.classList.remove('hidden');
        gateError.classList.add('hidden');
      } catch (err) {
        sessionStorage.removeItem(TOKEN_KEY);
        gateError.textContent = err.message || 'No se pudo entrar.';
        gateError.classList.remove('hidden');
      }
    }

    document.getElementById('token-submit').addEventListener('click', () => enter(tokenInput.value));
    tokenInput.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') enter(tokenInput.value);
    });
    document.getElementById('logout').addEventListener('click', () => {
      sessionStorage.removeItem(TOKEN_KEY);
      location.reload();
    });
    searchEl.addEventListener('input', render);

    if (token) {
      enter(token);
    }
  </script>
</body>
</html>
