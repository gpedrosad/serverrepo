<!DOCTYPE html>
<html lang="es-CL" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Perfil de personaje en Retro76, OT server chileno de Tibia 7.6: nivel, vocación, experiencia y muertes.">
  <title>Personaje — Retro76 | OT Server Chileno Tibia 7.6</title>
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Retro76">
  <meta property="og:locale" content="es_CL">
  <meta property="og:title" content="Personaje — Retro76">
  <meta property="og:description" content="Perfil de personaje en Retro76, OT server chileno de Tibia 7.6.">
  <meta property="og:image" content="https://retro76.cl/assets/brand/favicon.png">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; }
    .tbl th, .tbl td { padding: 0.4rem 0.6rem; }
    .tbl tr + tr { border-top: 1px solid rgba(255,255,255,.05); }
    .tbl tbody tr:hover { background: rgba(255,255,255,.035); }
    .anim-in {
      animation: fade-up 0.38s ease-out both;
      animation-delay: var(--d, 0ms);
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body class="min-h-full text-zinc-300 antialiased text-xs pb-16">
<div class="mx-auto max-w-2xl px-3 pt-3 sm:px-4">
  <header class="mb-4 flex items-end justify-between gap-3 border-b border-white/[0.06] pb-3">
    <div class="min-w-0">
      <a href="/" class="flex items-center gap-2 text-sm font-medium tracking-tight text-zinc-100 no-underline hover:text-white">
        <img src="/assets/brand/favicon.png" alt="" width="20" height="20" class="h-5 w-5 shrink-0 [image-rendering:pixelated]" decoding="async">
        Retro76
      </a>
      <p class="mt-0.5 text-[11px] text-zinc-500">Perfil de personaje</p>
    </div>
    <a href="/" class="text-[11px] text-sky-300/90 no-underline hover:text-sky-200">← Volver</a>
  </header>

  <div id="status" class="mb-4 text-[12px] text-zinc-500">Cargando…</div>
  <div id="profile" class="hidden space-y-5"></div>
</div>

<script>
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function charHref(name) {
  return `/character/${encodeURIComponent(name)}`;
}

function nameFromPath() {
  const parts = location.pathname.split('/').filter(Boolean);
  if (parts[0] !== 'character' || !parts[1]) return '';
  try { return decodeURIComponent(parts.slice(1).join('/')).trim(); }
  catch { return ''; }
}

async function load() {
  const name = nameFromPath();
  const status = document.getElementById('status');
  const root = document.getElementById('profile');
  if (!name) {
    status.textContent = 'Nombre inválido.';
    return;
  }
  document.title = `${name} — Retro76`;
  try {
    const r = await fetch(`/api/character/${encodeURIComponent(name)}`, { cache: 'no-store' });
    const d = await r.json();
    if (!r.ok || !d.ok || !d.character) {
      status.textContent = d.message || 'Personaje no encontrado.';
      return;
    }
    const c = d.character;
    document.title = `${c.name} — ${c.vocation} nivel ${c.level} | Retro76`;
    status.classList.add('hidden');
    root.classList.remove('hidden');
    const deaths = c.deaths || [];
    const deathRows = deaths.length
      ? deaths.map((d, i) =>
          `<tr class="anim-in" style="--d:${Math.min(i, 12) * 25}ms">
            <td class="text-zinc-600">${i + 1}</td>
            <td class="text-rose-300/80">${d.killer_is_player ? `<a class="no-underline hover:underline hover:text-rose-200" href="${charHref(d.killer)}">${esc(d.killer)}</a>` : esc(d.killer)}</td>
            <td class="text-zinc-400 tabular-nums">${d.level}</td>
            <td class="text-zinc-600">${esc(d.time_rel)}</td>
          </tr>`
        ).join('')
      : `<tr><td colspan="4" class="text-zinc-600">Sin muertes registradas</td></tr>`;

    root.innerHTML = `
      <div class="anim-in rounded-lg border border-white/[0.06] bg-white/[0.02] px-4 py-4" style="--d:0ms">
        <p class="text-[10px] uppercase tracking-widest text-zinc-600">Personaje</p>
        <h1 class="mt-1 text-lg font-medium tracking-tight text-zinc-100">${esc(c.name)}</h1>
        <p class="mt-1 text-[11px] text-zinc-500">${esc(c.vocation)}${c.guild ? ` · ${esc(c.guild)}` : ''} · visto ${esc(c.lastlogin_rel)}</p>
        <div class="mt-4 grid grid-cols-3 gap-2">
          <div class="rounded-md border border-white/[0.06] px-2.5 py-2">
            <p class="text-[10px] text-zinc-600">Level</p>
            <p class="mt-0.5 tabular-nums text-sm text-zinc-100">${c.level}</p>
          </div>
          <div class="rounded-md border border-white/[0.06] px-2.5 py-2">
            <p class="text-[10px] text-zinc-600">Magic Level</p>
            <p class="mt-0.5 tabular-nums text-sm text-zinc-100">${c.maglevel}</p>
          </div>
          <div class="rounded-md border border-white/[0.06] px-2.5 py-2">
            <p class="text-[10px] text-zinc-600">Exp</p>
            <p class="mt-0.5 tabular-nums text-sm text-zinc-100">${esc(c.exp_fmt)}</p>
          </div>
        </div>
      </div>
      <div class="anim-in" style="--d:60ms">
        <p class="mb-2 text-[10px] uppercase tracking-widest text-zinc-600">Muertes · ${deaths.length}</p>
        <div class="overflow-x-auto rounded-lg border border-white/[0.06]">
          <table class="tbl w-full min-w-[280px] text-left">
            <thead class="text-[10px] uppercase tracking-wide text-zinc-600">
              <tr><th>#</th><th>Killer</th><th>Lvl</th><th>Cuándo</th></tr>
            </thead>
            <tbody>${deathRows}</tbody>
          </table>
        </div>
      </div>`;
  } catch {
    status.textContent = 'Sin conexión.';
  }
}

load();
</script>
</body>
</html>
